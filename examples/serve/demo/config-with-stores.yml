          B12_md:
              ColorBar: "gray"
              ValueRange: [0., 0.25]
          SCL:
              ColorBar: "gray"
              ValueRange: [0, 255]
          rgb:
              Red:
                  Variable: B04_md
                  ValueRange: [0., 0.25]
              Green:
                  Variable: B03_md
                  ValueRange: [0., 0.25]
              Blue:
                  Variable: B02_md
                  ValueRange: [0., 0.25]
          ndvi:
              ColorBar: "delta"
              ValueRange: [-1., 1.]
          bci:
              ColorBar: "gray"
              ValueRange: [0., 0.25]
          msbi:
              ColorBar: "gray"
              ValueRange: [0., 0.25]
          ndmi:
              ColorBar: "gray"
              ValueRange: [0., 0.25]
          tsg:
              ColorBar: "gray"
              ValueRange: [0., 0.25]
          albedo:
              ColorBar: "gray"
              ValueRange: [0., 0.25]
    - Identifier: tif_style
      ColorMappings:
          band_1:
              ColorBar: bone
              ValueRange: [0., 255.]
          band_2:
              ColorBar: bone
              ValueRange: [0., 255.]
          band_3:
              ColorBar: bone
              ValueRange: [0., 255.]
          rgb:
              Red:
                  Variable: band_1
                  ValueRange: [0., 255.]
              Green:
                  Variable: band_2
                  ValueRange: [0., 255.]
              Blue:
                  Variable: band_3
                  ValueRange: [0., 255.]

