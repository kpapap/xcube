CustomColorMaps:
    - Identifier: binary_mask_quarries
      Type: categorical
      Colors:
          # Tuple format: [Value, Color, Label]
          # Class 0: No Change
          # Using a light gray with some transparency)
          - [0, "#969696", No Change]

          # Class 1: Change
          # Using bright yellow hex code (#FFFF00)
          - [1, "#FFFF00", Change]
    - Identifier: binary_mask_wildfires
      Type: categorical
      Colors:
          # Tuple format: [Value, Color, Label]
          # Class 0: No Change
          # Using a light gray with some transparency)
          - [0, "#969696", No Change]

          # Class 1: Change
          # Bright Red hex code
          - [1, "#FF0000", Change]
    - Identifier: magn_mask_wildfires
      Type: continuous
      Colors:
          - [0.0, "#0d0887", Low]
          - [0.25, "#6a00a8", Quarter]
          - [0.5, "#b12a90", Mid]
          - [0.75, "#e16462", Three Quarter]
          - [1.0, "#f0f921", High]
    - Identifier: ndmi_mask
      Type: continuous
      Colors:
          # Tuple format: [Value, Color, Label]
          - [-1.0, "#FF0000", Low Values]
          - [1.0, "#0000FF", High Values]
    - Identifier: tsg_mask
      Type: continuous
      Colors:
          # Tuple format: [Value, Color, Label]
          - [0.0, "#FF0000", Low Values]
          - [1.0, "#00FF00", High Values]

