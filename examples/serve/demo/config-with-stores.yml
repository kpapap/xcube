PlaceGroups:
    - Identifier: inside-cube
      Title: Places inside the cube
      Path: places/inside-cube.geojson
      Join:
          Property: ID
          Path: places/inside-cube-media.geojson
      PropertyMapping:
          image: ${resolve_config_path("images/inside-cube/${image}")}
    - Identifier: outside-cube
      Title: Places outside the cube
      Path: places/outside-cube.geojson
      PropertyMapping:
          image: ${resolve_config_path("images/outside-cube/${ID}.jpg")}

Styles:
    - Identifier: S2L2A
      ColorMappings:
          B01:
              ColorBar: "gray"
              ValueRange: [0., 0.25]
          B02_md:
              ColorBar: "gray"
              ValueRange: [0., 0.25]
          B03_md:
              ColorBar: "gray"
              ValueRange: [0., 0.25]
          B04_md:
              ColorBar: "gray"
              ValueRange: [0., 0.25]
          B05:
              ColorBar: "gray"
              ValueRange: [0., 0.25]
          B06:
              ColorBar: "gray"
              ValueRange: [0., 0.25]
          B07:
              ColorBar: "gray"
              ValueRange: [0., 0.25]
          B08_md:
              ColorBar: "gray"
              ValueRange: [0., 0.25]
          B8A:
              ColorBar: "gray"
              ValueRange: [0., 0.25]
          B09:
              ColorBar: "gray"
              ValueRange: [0., 0.25]
          B10:
              ColorBar: "gray"
              ValueRange: [0., 0.25]
          B11:
              ColorBar: "gray"
              ValueRange: [0., 0.25]
          B11_md:
