DatasetAttribution:
    - "© xcube & eo4natura"

DatasetChunkCacheSize: 250M

## You may want to specify a location of your server resources.
#base_dir: s3://<bucket>/<path-to-your>/<resources>/

# You may want to specify a remote location of your viewer resources.
#Viewer:
#  Configuration:
#    Path: s3://<bucket>/<path-to-your-viewer>/<resources>

DataStores:
    # # This section needs to be kept, because it is part of xcube server documentation using DataStores.
    - Identifier: wildcard-zarr
      StoreId: s3
      StoreParams:
          root: eo4naturazarr2/ndvi_from_aurora_with_pyramids.zarr
          max_depth: 1
          storage_options:
              anon: false
              key: ${AWS_ACCESS_KEY_ID}
              secret: ${AWS_SECRET_ACCESS_KEY}
      Datasets:
          - Path: "*.zarr"
            GroupTitle: WildcardZarr
            Style: S2L2A
            ChunkCacheSize: 250M
    - Identifier: new
      StoreId: s3
      StoreParams:
          root: eo4naturazarr2/zarr/median_seasonal_composites
          max_depth: 1
          storage_options:
              anon: false
              key: ${AWS_ACCESS_KEY_ID}
              secret: ${AWS_SECRET_ACCESS_KEY}
      Datasets:
          - Path: "TEST_without_any_S2_L2A_median_composite_2017-11-25_2018-03-20.zarr"
            Identifier: new
            Title: new
            GroupTitle: New
            Style: S2L2A
            ChunkCacheSize: 250M
    - Identifier: eo4natura-zarr
      StoreId: s3
      StoreParams:
          root: eo4naturazarr2/ndvi_from_aurora_with_pyramids.zarr
          max_depth: 1
          storage_options:
              anon: false
              key: ${AWS_ACCESS_KEY_ID}
              secret: ${AWS_SECRET_ACCESS_KEY}
      Datasets:
          - Identifier: eo4natura_s3_1
            Title: Datacube 01 3Is Stretched March 2023
            GroupTitle: Zarr
            # BoundingBox: [0.0, 50, 5.0, 52.5]
            Path: "cube_3Is_streched_2023-03-01_2023-03-30.zarr"
            Style: S2L2A
            ChunkCacheSize: 250M
            # PlaceGroups:
            #     - PlaceGroupRef: inside-cube
            #     - PlaceGroupRef: outside-cube
            # AccessControl:
            #     IsSubstitute: True
          - Identifier: eo4natura_s3_2
            Title: Datacube 02 3Is Stretched October 2023
            GroupTitle: Zarr
            # BoundingBox: [0.0, 50, 5.0, 52.5]
            Path: "cube_3Is_streched_2023-10-01_2023-10-30.zarr"
            Style: S2L2A
            ChunkCacheSize: 250M
            # PlaceGroups:
            #     - PlaceGroupRef: inside-cube
            #     - PlaceGroupRef: outside-cube
            # AccessControl:
            #     IsSubstitute: True
    - Identifier: eo4natura-tif
      StoreId: s3
      StoreParams:
          root: eo4naturazarr2/cogs/median_seasonal_composites/EU010M_E058N008T1/20240608
          max_depth: 1
          storage_options:
              anon: false
              key: ${AWS_ACCESS_KEY_ID}
              secret: ${AWS_SECRET_ACCESS_KEY}
      Datasets:
          - Identifier: eo4natura_s3_3
            Title: Datacube 20240608 cogs-tifs B02md
            GroupTitle: Tif
            # BoundingBox: [0.0, 50, 5.0, 52.5]
            Path: "S2_L2A_median_2024060820240913_EU010M_E058N008T1_B02_md.tif"
            Style: S2L2A
            ChunkCacheSize: 250M
            # PlaceGroups:
            #     - PlaceGroupRef: inside-cube
            #     - PlaceGroupRef: outside-cube
            # AccessControl:
            #     IsSubstitute: True
          - Identifier: eo4natura_s3_4
            Title: Datacube 20240608 cogs-tifs ndvi
            GroupTitle: Tif
            # BoundingBox: [0.0, 50, 5.0, 52.5]
            Path: "S2_L2A_median_2024060820240913_EU010M_E058N008T1_ndvi.tif"
            Style: S2L2A
            ChunkCacheSize: 250M
            # PlaceGroups:
            #     - PlaceGroupRef: inside-cube
            #     - PlaceGroupRef: outside-cube
            # AccessControl:
            #     IsSubstitute: True
    - Identifier: eo4natura-local
      StoreId: file
      StoreParams:
          root: ./examples/serve/demo
          max_depth: 1
      Datasets:
          - Identifier: cog_local
            Title: COG example
            GroupTitle: GeoTIFF
            Path: sample-cog.tif
            Style: tif_style
          - Identifier: geotiff_local
            Title: GeoTIFF example
            GroupTitle: GeoTIFF
            Path: sample-geotiff.tif
            Style: tif_style

PlaceGroups:
    - Identifier: inside-cube
      Title: Places inside the cube
      Path: places/inside-cube.geojson
      Join:
          Property: ID
          Path: places/inside-cube-media.geojson
      PropertyMapping:
          image: ${resolve_config_path("images/inside-cube/${image}")}
    - Identifier: outside-cube
      Title: Places outside the cube
      Path: places/outside-cube.geojson
      PropertyMapping:
          image: ${resolve_config_path("images/outside-cube/${ID}.jpg")}

Styles:
    - Identifier: S2L2A
      ColorMappings:
          B01:
              ColorBar: "gray"
              ValueRange: [0., 0.25]
          B02_md:
              ColorBar: "gray"
              ValueRange: [0., 0.25]
          B03_md:
              ColorBar: "gray"
              ValueRange: [0., 0.25]
          B04_md:
              ColorBar: "gray"
              ValueRange: [0., 0.25]
          B05:
              ColorBar: "gray"
              ValueRange: [0., 0.25]
          B06:
              ColorBar: "gray"
              ValueRange: [0., 0.25]
          B07:
              ColorBar: "gray"
              ValueRange: [0., 0.25]
          B08_md:
              ColorBar: "gray"
              ValueRange: [0., 0.25]
          B8A:
              ColorBar: "gray"
              ValueRange: [0., 0.25]
          B09:
              ColorBar: "gray"
              ValueRange: [0., 0.25]
          B10:
              ColorBar: "gray"
              ValueRange: [0., 0.25]
          B11:
              ColorBar: "gray"
              ValueRange: [0., 0.25]
          B11_md:
              ColorBar: "gray"
              ValueRange: [0., 0.25]
          B12:
              ColorBar: "gray"
              ValueRange: [0., 0.25]
          B12_md:
              ColorBar: "gray"
              ValueRange: [0., 0.25]
          SCL:
              ColorBar: "gray"
              ValueRange: [0, 255]
          rgb:
              Red:
                  Variable: B04_md
                  ValueRange: [0., 0.25]
              Green:
                  Variable: B03_md
                  ValueRange: [0., 0.25]
              Blue:
                  Variable: B02_md
                  ValueRange: [0., 0.25]
          ndvi:
              ColorBar: "delta"
              ValueRange: [-1000., 1000.]
          bci:
              ColorBar: "gray"
              ValueRange: [0., 0.25]
          msbi:
              ColorBar: "gray"
              ValueRange: [0., 0.25]
          ndmi:
              ColorBar: "gray"
              ValueRange: [0., 0.25]
          tsg:
              ColorBar: "gray"
              ValueRange: [0., 0.25]
          albedo:
              ColorBar: "gray"
              ValueRange: [0., 0.25]
    - Identifier: tif_style
      ColorMappings:
          band_1:
              ColorBar: bone
              ValueRange: [0., 255.]
          band_2:
              ColorBar: bone
              ValueRange: [0., 255.]
          band_3:
              ColorBar: bone
              ValueRange: [0., 255.]
          rgb:
              Red:
                  Variable: band_1
                  ValueRange: [0., 255.]
              Green:
                  Variable: band_2
                  ValueRange: [0., 255.]
              Blue:
                  Variable: band_3
                  ValueRange: [0., 255.]

